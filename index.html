<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
    button { font-size: 20px; padding: 10px 30px; }
  </style>
</head>
<body>
  <button id="startBtn" onclick="init()">Start</button>
  <div id="webcam-container"></div>
  <div id="label-container" style="font-size:22px;margin-top:10px;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script>
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/IMGIB8wP6/";
    let model, webcam, lastSent = 0;

    async function init() {
      document.getElementById("label-container").innerHTML = "Loading model...";
      try {
        model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
        webcam = new tmImage.Webcam(300, 300, false);
        await webcam.setup({ facingMode: "environment" }); // back camera; use "user" for front
        await webcam.play();
        document.getElementById("startBtn").style.display = "none";
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        window.requestAnimationFrame(loop);
      } catch (e) {
        document.getElementById("label-container").innerHTML = "Error: " + e.message;
      }
    }

    async function loop() {
      webcam.update();
      const now = Date.now();
      if (now - lastSent > 300) {   // classify about 3 times per second
        lastSent = now;
        await predict();
      }
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      let best = prediction[0];
      for (const p of prediction) if (p.probability > best.probability) best = p;
      document.getElementById("label-container").innerHTML =
        best.className + ": " + (best.probability * 100).toFixed(0) + "%";
      if (window.AppInventor) {
        window.AppInventor.setWebViewString(best.className);
      }
    }
  </script>
</body>
</html>
